<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VISUAL | Photographer Hiring Marketplace</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: '#07080B',
            surface: '#0F1117',
            surfaceElevated: '#161922',
            accent: '#6366F1',
            cyanAccent: '#06B6D4'
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #07080B; color: #F3F4F6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const siteConfig = {
      name: "VISUAL",
      tagline: "SEE THE MOMENT. FEEL THE STORY.",
      headline: "YOUR VISION. THE RIGHT PHOTOGRAPHER.",
      owner: "Er. Md Mutasaddik Arham",
      attribution: "Founded and operated by Er. Md Mutasaddik Arham.",
      categories: [
        "Wedding", "Portrait", "Events", "Birthday", "Fashion",
        "Product", "Corporate", "Graduation", "Travel", "Real Estate"
      ]
    };

    const DEFAULT_PHOTOGRAPHERS = [
      {
        id: 'p1',
        name: 'Elena Vance Visuals',
        city: 'New York, NY',
        specialties: ['Fashion', 'Portrait', 'Wedding'],
        price: 650,
        rating: 4.96,
        phone: '+1 212-555-0192',
        cover: 'https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?auto=format&fit=crop&w=800&q=80',
        bio: 'Award-winning visual storyteller capturing haute couture, editorial campaigns, and intimate portraits.'
      },
      {
        id: 'p2',
        name: 'Sterling Cinematic Weddings',
        city: 'San Francisco, CA',
        specialties: ['Wedding', 'Events'],
        price: 1200,
        rating: 5.0,
        phone: '+1 415-555-0148',
        cover: 'https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=800&q=80',
        bio: 'Documentary-style wedding specialist with 12+ years experience documenting luxury celebrations worldwide.'
      },
      {
        id: 'p3',
        name: 'Studio Arham Architecture',
        city: 'Chicago, IL',
        specialties: ['Corporate', 'Real Estate', 'Product'],
        price: 500,
        rating: 4.92,
        phone: '+1 312-555-0199',
        cover: 'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=800&q=80',
        bio: 'High precision commercial spaces, real estate aerials, and executive corporate photography.'
      }
    ];

    function App() {
      const [view, setView] = useState('home');
      const [category, setCategory] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      const [hiringModal, setHiringModal] = useState(false);
      const [selectedPhotographer, setSelectedPhotographer] = useState(null);
      const [adminTab, setAdminTab] = useState('add');

      // LocalStorage Persistence for Photographers
      const [photographers, setPhotographers] = useState(() => {
        const saved = localStorage.getItem('visual_photographers');
        return saved ? JSON.parse(saved) : DEFAULT_PHOTOGRAPHERS;
      });

      // LocalStorage Persistence for Hiring Inquiries
      const [inquiries, setInquiries] = useState(() => {
        const saved = localStorage.getItem('visual_inquiries');
        return saved ? JSON.parse(saved) : [
          { id: 'VIS-HR-10928', client: 'Sarah Khan', photographer: 'Elena Vance Visuals', event: 'Wedding Reception', date: '2026-11-20', status: 'Pending' }
        ];
      });

      // Save on change
      useEffect(() => {
        localStorage.setItem('visual_photographers', JSON.stringify(photographers));
      }, [photographers]);

      useEffect(() => {
        localStorage.setItem('visual_inquiries', JSON.stringify(inquiries));
      }, [inquiries]);

      // Handle Adding New Photographer Manually
      const handleAddPhotographer = (e) => {
        e.preventDefault();
        const f = e.target;
        const newPhoto = {
          id: 'photo-' + Date.now(),
          name: f.p_name.value,
          city: f.p_city.value,
          specialties: f.p_specialties.value.split(',').map(s => s.trim()),
          price: Number(f.p_price.value),
          rating: 5.0,
          phone: f.p_phone.value || '+1 000-000-0000',
          cover: f.p_cover.value || 'https://images.unsplash.com/photo-1542038784456-1ea8e935640e?auto=format&fit=crop&w=800&q=80',
          bio: f.p_bio.value
        };

        setPhotographers([newPhoto, ...photographers]);
        alert(`ফটোগ্রাফার "${newPhoto.name}" সফলভাবে যুক্ত হয়েছে! এটি এখন Explore পেজে দেখা যাবে।`);
        f.reset();
        setAdminTab('list');
      };

      // Handle Deleting Photographer
      const handleDeletePhotographer = (id, name) => {
        if (confirm(`আপনি কি সত্যিই "${name}" কে প্ল্যাটফর্ম থেকে মুছে ফেলতে চান?`)) {
          setPhotographers(photographers.filter(p => p.id !== id));
        }
      };

      // Handle Hiring Submission
      const handleHireSubmit = (e) => {
        e.preventDefault();
        const ref = 'VIS-HR-' + Math.floor(100000 + Math.random() * 900000);
        const name = e.target.c_name.value;
        const ev = e.target.c_event.value;
        const date = e.target.c_date.value;
        const newInq = {
          id: ref,
          client: name,
          photographer: selectedPhotographer?.name || 'Assigned Talent',
          event: ev,
          date,
          status: 'Pending'
        };
        setInquiries([newInq, ...inquiries]);
        alert(`Success! আপনার হায়ার রিকোয়েস্ট পাঠানো হয়েছে। রেফারেন্স কোড: ${ref}`);
        setHiringModal(false);
      };

      const filtered = useMemo(() => {
        return photographers.filter(p => {
          const matchCat = category === 'All' || p.specialties.some(s => s.toLowerCase() === category.toLowerCase());
          const matchCity = !searchQuery || p.city.toLowerCase().includes(searchQuery.toLowerCase());
          return matchCat && matchCity;
        });
      }, [photographers, category, searchQuery]);

      return (
        <div className="min-h-screen flex flex-col justify-between">
          
          {/* NAVIGATION BAR */}
          <nav className="sticky top-0 z-50 bg-[#07080B]/90 backdrop-blur-md border-b border-white/10 px-6 py-4">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              
              <div onClick={() => setView('home')} className="cursor-pointer flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-black text-white text-xl shadow-[0_0_15px_rgba(99,102,241,0.5)]">
                  V
                </div>
                <div>
                  <span className="text-xl font-black tracking-widest text-white uppercase block leading-none font-mono">
                    {siteConfig.name}
                  </span>
                  <span className="text-[9px] font-mono tracking-widest text-zinc-500 uppercase">
                    PHOTOGRAPHER HUB
                  </span>
                </div>
              </div>

              {/* View Switches */}
              <div className="hidden md:flex items-center space-x-6 text-xs font-mono uppercase tracking-widest text-zinc-400">
                <button onClick={() => setView('home')} className={view === 'home' ? 'text-cyan-400 font-bold' : 'hover:text-white'}>Home</button>
                <button onClick={() => setView('explore')} className={view === 'explore' ? 'text-cyan-400 font-bold' : 'hover:text-white'}>Explore ({photographers.length})</button>
                <button onClick={() => setView('admin')} className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-lg border transition ${view === 'admin' ? 'border-indigo-500 text-white bg-indigo-600/20' : 'border-white/10 hover:border-cyan-400 text-zinc-300'}`}>
                  <span>⚙️ Admin Panel</span>
                </button>
              </div>

              <div className="flex items-center space-x-3">
                <button onClick={() => setView('admin')} className="px-4 py-2 rounded-full border border-indigo-500/50 hover:bg-indigo-600/10 text-xs font-mono text-cyan-400 font-bold uppercase transition">
                  + Add Photographer
                </button>
                <button onClick={() => setView('explore')} className="px-5 py-2 rounded-full bg-gradient-to-r from-indigo-500 to-cyan-500 text-xs font-mono font-bold uppercase text-white shadow-lg hover:opacity-90 transition">
                  Find Talent
                </button>
              </div>
            </div>
          </nav>

          {/* VIEW 1: HOMEPAGE */}
          {view === 'home' && (
            <main className="flex-1">
              <section className="text-center py-24 px-6 relative">
                <div className="inline-block px-4 py-1.5 rounded-full border border-white/10 bg-white/5 text-[10px] font-mono uppercase tracking-widest text-cyan-400 mb-6">
                  {siteConfig.tagline}
                </div>
                <h1 className="text-5xl md:text-7xl font-black uppercase tracking-tight max-w-4xl mx-auto leading-tight">
                  YOUR VISION. <br />
                  <span className="text-transparent bg-clip-text bg-gradient-to-r from-white via-zinc-200 to-cyan-400">
                    THE RIGHT PHOTOGRAPHER.
                  </span>
                </h1>
                <p className="text-zinc-400 text-sm max-w-xl mx-auto mt-6">
                  Discover talented photographers, explore extraordinary portfolios, and find the perfect professional for your next unforgettable moment.
                </p>

                <div className="mt-10 flex flex-wrap justify-center gap-4">
                  <button onClick={() => setView('explore')} className="px-8 py-3.5 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-mono font-bold uppercase tracking-widest shadow-[0_0_25px_rgba(99,102,241,0.4)]">
                    Explore Photographers ({photographers.length})
                  </button>
                  <button onClick={() => setView('admin')} className="px-8 py-3.5 rounded-full border border-white/20 hover:bg-white/5 text-white text-xs font-mono font-bold uppercase tracking-widest">
                    Manage & Add Photographers
                  </button>
                </div>
              </section>

              {/* HOW IT WORKS */}
              <section className="py-16 border-t border-white/10 bg-[#0A0C10] px-6">
                <div className="max-w-6xl mx-auto">
                  <h2 className="text-2xl font-black uppercase text-center mb-12">How VISUAL Works</h2>
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                    {['01. Discover Photographers', '02. Explore Portfolios', '03. Submit a Request', '04. Finalize Booking'].map((step, idx) => (
                      <div key={idx} className="p-6 rounded-2xl bg-[#0F1117] border border-white/5 space-y-2">
                        <span className="text-base font-mono text-cyan-400 font-bold">{step}</span>
                        <p className="text-xs text-zinc-400">Direct client-to-photographer collaboration with zero fees.</p>
                      </div>
                    ))}
                  </div>
                </div>
              </section>
            </main>
          )}

          {/* VIEW 2: EXPLORE MARKETPLACE */}
          {view === 'explore' && (
            <main className="flex-1 max-w-7xl mx-auto px-6 py-12 w-full">
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                <div>
                  <h1 className="text-3xl font-black uppercase">Explore Photographers</h1>
                  <p className="text-xs text-zinc-400">Showing {filtered.length} verified independent photography artists.</p>
                </div>
                <button onClick={() => setView('admin')} className="self-start px-4 py-2 rounded-xl bg-indigo-600/30 border border-indigo-500/50 text-xs font-mono text-cyan-400">
                  + Add New Photographer (Admin)
                </button>
              </div>

              {/* Filters */}
              <div className="p-4 rounded-2xl bg-[#0F1117] border border-white/10 grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                <div>
                  <label className="text-[10px] font-mono uppercase text-zinc-400 block mb-1">Filter by Category</label>
                  <select value={category} onChange={(e) => setCategory(e.target.value)} className="w-full bg-[#161922] border border-white/10 rounded-xl px-3 py-2 text-xs text-white">
                    <option value="All">All Categories</option>
                    {siteConfig.categories.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
                <div>
                  <label className="text-[10px] font-mono uppercase text-zinc-400 block mb-1">Search by City</label>
                  <input type="text" placeholder="e.g. New York, Chicago, Dhaka..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full bg-[#161922] border border-white/10 rounded-xl px-3 py-2 text-xs text-white" />
                </div>
              </div>

              {/* Cards Grid */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                {filtered.map(p => (
                  <div key={p.id} className="rounded-2xl bg-[#0F1117] border border-white/10 overflow-hidden flex flex-col justify-between">
                    <div className="h-52 bg-zinc-800 relative">
                      <img src={p.cover} alt={p.name} className="w-full h-full object-cover" />
                      <span className="absolute top-3 left-3 bg-black/60 backdrop-blur-md px-2.5 py-1 rounded-full text-[10px] font-mono">{p.city}</span>
                      <span className="absolute top-3 right-3 bg-black/60 backdrop-blur-md px-2.5 py-1 rounded-full text-[10px] font-mono text-amber-400">★ {p.rating}</span>
                    </div>
                    <div className="p-6 flex-1 flex flex-col justify-between">
                      <div>
                        <h3 className="text-base font-bold text-white">{p.name}</h3>
                        <p className="text-xs text-zinc-400 mt-2 line-clamp-2">{p.bio}</p>
                        <div className="flex flex-wrap gap-1 mt-3">
                          {p.specialties.map((s, i) => (
                            <span key={i} className="text-[9px] font-mono bg-white/5 border border-white/10 px-2 py-0.5 rounded text-zinc-300">{s}</span>
                          ))}
                        </div>
                      </div>
                      <div className="pt-4 mt-6 border-t border-white/10 flex items-center justify-between">
                        <div>
                          <span className="text-[10px] text-zinc-500 font-mono block">Starting At</span>
                          <span className="text-sm font-bold font-mono text-white">${p.price}</span>
                        </div>
                        <button onClick={() => { setSelectedPhotographer(p); setHiringModal(true); }} className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-mono font-bold uppercase text-white shadow-lg">
                          Hire Now
                        </button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </main>
          )}

          {/* VIEW 3: COMPREHENSIVE ADMIN PANEL (Er. Md Mutasaddik Arham) */}
          {view === 'admin' && (
            <main className="flex-1 max-w-6xl mx-auto px-6 py-12 w-full">
              
              {/* Admin Header */}
              <div className="p-6 rounded-2xl bg-[#0F1117] border border-white/10 mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                  <span className="text-[10px] font-mono uppercase tracking-widest text-cyan-400 bg-cyan-950/60 border border-cyan-500/30 px-2.5 py-1 rounded-full">
                    MASTER CONTROL PANEL
                  </span>
                  <h1 className="text-3xl font-black uppercase text-white mt-2">VISUAL Administrator Console</h1>
                  <p className="text-xs text-zinc-400 mt-1">Platform Owner & Operator: <strong className="text-white">{siteConfig.owner}</strong></p>
                </div>

                {/* Tab Switcher */}
                <div className="flex items-center space-x-2 bg-black/40 p-1.5 rounded-xl border border-white/10">
                  <button onClick={() => setAdminTab('add')} className={`px-4 py-2 rounded-lg text-xs font-mono uppercase transition ${adminTab === 'add' ? 'bg-indigo-600 text-white' : 'text-zinc-400 hover:text-white'}`}>
                    + Add Photographer
                  </button>
                  <button onClick={() => setAdminTab('list')} className={`px-4 py-2 rounded-lg text-xs font-mono uppercase transition ${adminTab === 'list' ? 'bg-indigo-600 text-white' : 'text-zinc-400 hover:text-white'}`}>
                    Manage Profiles ({photographers.length})
                  </button>
                  <button on
