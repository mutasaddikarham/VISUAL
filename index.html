<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VISUAL | Photographer Hiring Marketplace</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: '#07080B',
            surface: '#0F1117',
            accent: '#6366F1',
            cyanAccent: '#06B6D4'
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #07080B; color: #F3F4F6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const siteConfig = {
      name: "VISUAL",
      tagline: "SEE THE MOMENT. FEEL THE STORY.",
      headline: "YOUR VISION. THE RIGHT PHOTOGRAPHER.",
      owner: "Er. Md Mutasaddik Arham",
      attribution: "Founded and operated by Er. Md Mutasaddik Arham.",
      categories: [
        "Wedding", "Portrait", "Events", "Birthday", "Fashion",
        "Product", "Corporate", "Graduation", "Travel", "Real Estate"
      ]
    };

    const PHOTOGRAPHERS = [
      {
        id: 'p1',
        name: 'Elena Vance Visuals',
        city: 'New York, NY',
        specialties: ['Fashion', 'Portrait', 'Wedding'],
        price: 650,
        rating: 4.96,
        cover: 'https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?auto=format&fit=crop&w=800&q=80',
        bio: 'Award-winning visual storyteller capturing haute couture, editorial campaigns, and intimate portraits.'
      },
      {
        id: 'p2',
        name: 'Sterling Cinematic Weddings',
        city: 'San Francisco, CA',
        specialties: ['Wedding', 'Events'],
        price: 1200,
        rating: 5.0,
        cover: 'https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=800&q=80',
        bio: 'Documentary-style wedding specialist with 12+ years experience documenting luxury celebrations worldwide.'
      },
      {
        id: 'p3',
        name: 'Studio Arham Architecture',
        city: 'Chicago, IL',
        specialties: ['Corporate', 'Real Estate', 'Product'],
        price: 500,
        rating: 4.92,
        cover: 'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=800&q=80',
        bio: 'High precision commercial spaces, real estate aerials, and executive corporate photography.'
      }
    ];

    function App() {
      const [view, setView] = useState('home');
      const [category, setCategory] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      const [hiringModal, setHiringModal] = useState(false);
      const [selectedPhotographer, setSelectedPhotographer] = useState(PHOTOGRAPHERS[0]);
      const [inquiries, setInquiries] = useState([
        { id: 'VIS-HR-10928', client: 'Sarah Khan', event: 'Wedding Reception', date: '2026-11-20', status: 'Pending' }
      ]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [view, hiringModal]);

      const filtered = useMemo(() => {
        return PHOTOGRAPHERS.filter(p => {
          const matchCat = category === 'All' || p.specialties.includes(category);
          const matchCity = !searchQuery || p.city.toLowerCase().includes(searchQuery.toLowerCase());
          return matchCat && matchCity;
        });
      }, [category, searchQuery]);

      const handleHireSubmit = (e) => {
        e.preventDefault();
        const ref = 'VIS-HR-' + Math.floor(100000 + Math.random() * 900000);
        const name = e.target.c_name.value;
        const ev = e.target.c_event.value;
        const date = e.target.c_date.value;
        setInquiries([{ id: ref, client: name, event: ev, date, status: 'Pending' }, ...inquiries]);
        alert(`Success! Hiring request sent. Tracking Reference: ${ref}`);
        setHiringModal(false);
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          
          {/* HEADER / NAVIGATION */}
          <nav className="sticky top-0 z-50 bg-[#07080B]/90 backdrop-blur-md border-b border-white/10 px-6 py-4">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <div onClick={() => setView('home')} className="cursor-pointer flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-black text-white text-xl shadow-[0_0_15px_rgba(99,102,241,0.5)]">
                  V
                </div>
                <div>
                  <span className="text-xl font-black tracking-widest text-white uppercase block leading-none font-mono">
                    {siteConfig.name}
                  </span>
                  <span className="text-[9px] font-mono tracking-widest text-zinc-500 uppercase">
                    MARKETPLACE
                  </span>
                </div>
              </div>

              <div className="hidden md:flex items-center space-x-8 text-xs font-mono uppercase tracking-widest text-zinc-400">
                <button onClick={() => setView('home')} className={view === 'home' ? 'text-cyan-400 font-bold' : 'hover:text-white'}>Home</button>
                <button onClick={() => setView('explore')} className={view === 'explore' ? 'text-cyan-400 font-bold' : 'hover:text-white'}>Explore</button>
                <button onClick={() => setView('photographer_dash')} className={view === 'photographer_dash' ? 'text-cyan-400 font-bold' : 'hover:text-white'}>Photographer Console</button>
                <button onClick={() => setView('admin')} className={view === 'admin' ? 'text-cyan-400 font-bold' : 'hover:text-white'}>Admin Portal</button>
              </div>

              <div className="flex items-center space-x-3">
                <button onClick={() => setView('explore')} className="px-5 py-2 rounded-full bg-gradient-to-r from-indigo-500 to-cyan-500 text-xs font-mono font-bold uppercase text-white shadow-lg hover:opacity-90 transition">
                  Find Talent
                </button>
              </div>
            </div>
          </nav>

          {/* VIEW: HOMEPAGE */}
          {view === 'home' && (
            <main className="flex-1">
              <section className="text-center py-24 px-6 relative">
                <div className="inline-block px-4 py-1.5 rounded-full border border-white/10 bg-white/5 text-[10px] font-mono uppercase tracking-widest text-cyan-400 mb-6">
                  {siteConfig.tagline}
                </div>
                <h1 className="text-5xl md:text-7xl font-black uppercase tracking-tight max-w-4xl mx-auto leading-tight">
                  YOUR VISION. <br />
                  <span className="text-transparent bg-clip-text bg-gradient-to-r from-white via-zinc-200 to-cyan-400">
                    THE RIGHT PHOTOGRAPHER.
                  </span>
                </h1>
                <p className="text-zinc-400 text-sm max-w-xl mx-auto mt-6">
                  Discover exceptional talent, explore extraordinary portfolios, and book verified professionals effortlessly.
                </p>

                <div className="mt-10 flex flex-wrap justify-center gap-4">
                  <button onClick={() => setView('explore')} className="px-8 py-3.5 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-mono font-bold uppercase tracking-widest shadow-[0_0_25px_rgba(99,102,241,0.4)]">
                    Explore Photographers
                  </button>
                  <button onClick={() => setView('photographer_dash')} className="px-8 py-3.5 rounded-full border border-white/20 hover:bg-white/5 text-white text-xs font-mono font-bold uppercase tracking-widest">
                    Join As Photographer (Free)
                  </button>
                </div>
              </section>

              {/* HOW IT WORKS */}
              <section className="py-16 border-t border-white/10 bg-[#0A0C10] px-6">
                <div className="max-w-6xl mx-auto">
                  <h2 className="text-2xl font-black uppercase text-center mb-12">How VISUAL Works</h2>
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                    {['01. Discover', '02. Explore Portfolios', '03. Submit Request', '04. Finalize & Shoot'].map((step, idx) => (
                      <div key={idx} className="p-6 rounded-2xl bg-[#0F1117] border border-white/5 space-y-2">
                        <span className="text-xl font-mono text-cyan-400 font-bold">{step}</span>
                        <p className="text-xs text-zinc-400">Direct client-to-photographer collaboration with zero middleman friction.</p>
                      </div>
                    ))}
                  </div>
                </div>
              </section>
            </main>
          )}

          {/* VIEW: EXPLORE MARKETPLACE */}
          {view === 'explore' && (
            <main className="flex-1 max-w-7xl mx-auto px-6 py-12 w-full">
              <h1 className="text-3xl font-black uppercase mb-2">Explore Photographers</h1>
              <p className="text-xs text-zinc-400 mb-8">Browse verified independent photography artists.</p>

              {/* Filters */}
              <div className="p-4 rounded-2xl bg-[#0F1117] border border-white/10 grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                <div>
                  <label className="text-[10px] font-mono uppercase text-zinc-400 block mb-1">Category</label>
                  <select value={category} onChange={(e) => setCategory(e.target.value)} className="w-full bg-[#161922] border border-white/10 rounded-xl px-3 py-2 text-xs text-white">
                    <option value="All">All Categories</option>
                    {siteConfig.categories.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
                <div>
                  <label className="text-[10px] font-mono uppercase text-zinc-400 block mb-1">Search City</label>
                  <input type="text" placeholder="e.g. New York, Chicago..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full bg-[#161922] border border-white/10 rounded-xl px-3 py-2 text-xs text-white" />
                </div>
              </div>

              {/* Photographers Grid */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                {filtered.map(p => (
                  <div key={p.id} className="rounded-2xl bg-[#0F1117] border border-white/10 overflow-hidden flex flex-col justify-between">
                    <div className="h-52 bg-zinc-800 relative">
                      <img src={p.cover} alt={p.name} className="w-full h-full object-cover" />
                      <span className="absolute top-3 left-3 bg-black/60 backdrop-blur-md px-2.5 py-1 rounded-full text-[10px] font-mono">{p.city}</span>
                      <span className="absolute top-3 right-3 bg-black/60 backdrop-blur-md px-2.5 py-1 rounded-full text-[10px] font-mono text-amber-400">★ {p.rating}</span>
                    </div>
                    <div className="p-6 flex-1 flex flex-col justify-between">
                      <div>
                        <h3 className="text-base font-bold text-white">{p.name}</h3>
                        <p className="text-xs text-zinc-400 mt-2 line-clamp-2">{p.bio}</p>
                        <div className="flex flex-wrap gap-1 mt-3">
                          {p.specialties.map((s, i) => (
                            <span key={i} className="text-[9px] font-mono bg-white/5 border border-white/10 px-2 py-0.5 rounded text-zinc-300">{s}</span>
                          ))}
                        </div>
                      </div>
                      <div className="pt-4 mt-6 border-t border-white/10 flex items-center justify-between">
                        <div>
                          <span className="text-[10px] text-zinc-500 font-mono block">From</span>
                          <span className="text-sm font-bold font-mono text-white">${p.price}</span>
                        </div>
                        <button onClick={() => { setSelectedPhotographer(p); setHiringModal(true); }} className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-mono font-bold uppercase text-white">
                          Hire
                        </button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </main>
          )}

          {/* VIEW: PHOTOGRAPHER DASHBOARD */}
          {view === 'photographer_dash' && (
            <main className="flex-1 max-w-6xl mx-auto px-6 py-12 w-full">
              <div className="flex justify-between items-center pb-6 border-b border-white/10 mb-8">
                <div>
                  <span className="text-[10px] font-mono uppercase tracking-widest text-emerald-400 bg-emerald-950/60 border border-emerald-500/30 px-2.5 py-0.5 rounded-full">
                    FREE LISTING TIER
                  </span>
                  <h1 className="text-2xl font-black uppercase text-white mt-2">Photographer Console</h1>
                </div>
              </div>
              <h3 className="text-sm font-mono uppercase text-zinc-400 mb-4">Received Inquiries ({inquiries.length})</h3>
              <div className="space-y-3">
                {inquiries.map(inq => (
                  <div key={inq.id} className="p-4 rounded-xl bg-[#0F1117] border border-white/10 flex justify-between items-center">
                    <div>
                      <span className="text-xs font-mono text-cyan-400 font-bold">{inq.id}</span>
                      <h4 className="text-sm font-bold text-white">{inq.event} — {inq.client}</h4>
                      <p className="text-xs text-zinc-500">Date: {inq.date}</p>
                    </div>
                    <span className="text-xs font-mono bg-white/5 px-3 py-1 rounded-lg text-emerald-400">{inq.status}</span>
                  </div>
                ))}
              </div>
            </main>
          )}

          {/* VIEW: ADMIN PORTAL (Er. Md Mutasaddik Arham) */}
          {view === 'admin' && (
            <main className="flex-1 max-w-6xl mx-auto px-6 py-12 w-full">
              <div className="pb-6 border-b border-white/10 mb-8">
                <span className="text-xs font-mono text-cyan-400 uppercase tracking-widest">Master Admin</span>
                <h1 className="text-3xl font-black uppercase text-white mt-1">VISUAL Command Center</h1>
                <p className="text-xs text-zinc-400 mt-1">Founder & Operator: <strong>{siteConfig.owner}</strong></p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div className="p-5 rounded-xl bg-[#0F1117] border border-white/10">
                  <span className="text-xs font-mono text-zinc-500">Total Photographers</span>
                  <p className="text-2xl font-black font-mono text-white mt-1">{PHOTOGRAPHERS.length}</p>
                </div>
                <div className="p-5 rounded-xl bg-[#0F1117] border border-white/10">
                  <span className="text-xs font-mono text-zinc-500">Total Inquiries</span>
                  <p className="text-2xl font-black font-mono text-white mt-1">{inquiries.length}</p>
                </div>
                <div className="p-5 rounded-xl bg-[#0F1117] border border-white/10">
                  <span className="text-xs font-mono text-zinc-500">Business Model</span>
                  <p className="text-sm font-mono text-emerald-400 mt-1 font-bold">100% Free Listing</p>
                </div>
              </div>
            </main>
          )}

          {/* MODAL: HIRING REQUEST */}
          {hiringModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-[#0F1117] border border-white/10 rounded-2xl p-6 w-full max-w-md relative">
                <button onClick={() => setHiringModal(false)} className="absolute top-4 right-4 text-zinc-500 hover:text-white">✕</button>
                <h3 className="text-lg font-bold text-white">Hire {selectedPhotographer.name}</h3>
                <p className="text-xs text-zinc-400 mt-1">Send your project specifications directly.</p>

                <form onSubmit={handleHireSubmit} className="space-y-3 mt-4">
                  <input required name="c_name" type="text" placeholder="Your Full Name" className="w-full bg-[#161922] border border-white/10 rounded-xl px-3 py-2 text-xs text-white" />
                  <input required name="c_event" type="text" placeholder="Event Type (e.g. Wedding, Fashion)" className="w-full bg-[#161922] border border-white/10 rounded-xl px-3 py-2 text-xs text-white" />
                  <input required name="c_date" type="date" className="w-full bg-[#161922] border border-white/10 rounded-xl px-3 py-2 text-xs text-white" />
                  <button type="submit" className="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-mono font-bold uppercase text-white transition">
                    Send Hiring Inquiry
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-[#050608] border-t border-white/10 py-10 px-6 text-xs text-zinc-500">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
              <div>
                <span className="text-white font-mono font-bold uppercase text-sm block">{siteConfig.name}</span>
                <span className="text-[11px] text-zinc-500">{siteConfig.tagline}</span>
              </div>
              <div className="text-center md:text-right">
                <p className="text-zinc-300 font-medium">{siteConfig.attribution}</p>
                <p className="text-[10px] text-zinc-600 mt-0.5">© 2026 VISUAL. All rights reserved.</p>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
