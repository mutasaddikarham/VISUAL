<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VISUAL | Photographer Hiring Marketplace</title>
  <!-- Fast, Reliable Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: '#07080B',
            surface: '#0F1117',
            surfaceElevated: '#161922',
            accent: '#6366F1',
            cyanAccent: '#06B6D4'
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #07080B; color: #F3F4F6; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- APP ROOT CONTAINER -->
  <div id="app"></div>

  <script>
    const siteConfig = {
      name: "VISUAL",
      tagline: "SEE THE MOMENT. FEEL THE STORY.",
      headline: "YOUR VISION. THE RIGHT PHOTOGRAPHER.",
      currency: "৳",
      currencyCode: "BDT",
      owner: "Er. Md Mutasaddik Arham",
      attribution: "Founded and operated by Er. Md Mutasaddik Arham.",
      categories: [
        "Wedding", "Portrait", "Events", "Birthday", "Fashion",
        "Product", "Corporate", "Graduation", "Travel", "Real Estate"
      ]
    };

    const DEFAULT_PHOTOGRAPHERS = [
      {
        id: 'p1',
        name: 'Elena Vance Visuals',
        city: 'Dhaka, Bangladesh',
        specialties: ['Fashion', 'Portrait', 'Wedding'],
        price: 8500,
        rating: 4.96,
        phone: '+8801700000000',
        cover: 'https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?auto=format&fit=crop&w=800&q=80',
        bio: 'Award-winning visual storyteller capturing haute couture, editorial campaigns, and intimate portraits.'
      },
      {
        id: 'p2',
        name: 'Sterling Cinematic Weddings',
        city: 'Chittagong, Bangladesh',
        specialties: ['Wedding', 'Events'],
        price: 18000,
        rating: 5.0,
        phone: '+8801800000000',
        cover: 'https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=800&q=80',
        bio: 'Documentary-style wedding specialist with 12+ years experience documenting luxury celebrations worldwide.'
      },
      {
        id: 'p3',
        name: 'Studio Arham Architecture',
        city: 'Sylhet, Bangladesh',
        specialties: ['Corporate', 'Real Estate', 'Product'],
        price: 6000,
        rating: 4.92,
        phone: '+8801900000000',
        cover: 'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=800&q=80',
        bio: 'High precision commercial spaces, real estate aerials, and executive corporate photography.'
      }
    ];

    // LocalStorage State Management
    let state = {
      view: 'home',
      category: 'All',
      searchQuery: '',
      adminTab: 'add',
      modalOpen: false,
      loginModalOpen: false,
      loginError: false,
      isSubmittingEmail: false,
      isAdminLoggedIn: sessionStorage.getItem('visual_admin_logged') === 'true',
      adminPassword: localStorage.getItem('visual_admin_pass') || 'arham2026',
      adminWhatsApp: localStorage.getItem('visual_admin_wa') || '+8801700000000',
      adminEmail: localStorage.getItem('visual_admin_email') || 'admin@visualmarketplace.com', // Admin Gmail
      selectedPhotographer: null,
      lastSubmittedInquiry: null,
      photographers: JSON.parse(localStorage.getItem('visual_photographers')) || DEFAULT_PHOTOGRAPHERS,
      inquiries: JSON.parse(localStorage.getItem('visual_inquiries')) || [
        { id: 'VIS-HR-10928', client: 'Sarah Khan', email: 'sarah@example.com', phone: '+8801700000000', photographer: 'Elena Vance Visuals', event: 'Wedding Reception', date: '2026-11-20', status: 'Pending' }
      ]
    };

    function saveState() {
      localStorage.setItem('visual_photographers', JSON.stringify(state.photographers));
      localStorage.setItem('visual_inquiries', JSON.stringify(state.inquiries));
      localStorage.setItem('visual_admin_pass', state.adminPassword);
      localStorage.setItem('visual_admin_wa', state.adminWhatsApp);
      localStorage.setItem('visual_admin_email', state.adminEmail);
    }

    function setView(v) {
      if (v === 'admin' && !state.isAdminLoggedIn) {
        state.loginModalOpen = true;
        state.loginError = false;
        render();
        return;
      }
      state.view = v;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function handleAdminLogin(e) {
      e.preventDefault();
      const entered = e.target.pass.value;
      if (entered === state.adminPassword) {
        state.isAdminLoggedIn = true;
        sessionStorage.setItem('visual_admin_logged', 'true');
        state.loginModalOpen = false;
        state.loginError = false;
        state.view = 'admin';
        render();
      } else {
        state.loginError = true;
        render();
      }
    }

    function handleAdminLogout() {
      state.isAdminLoggedIn = false;
      sessionStorage.removeItem('visual_admin_logged');
      state.view = 'home';
      alert('অ্যাডমিন প্যানেল সফলভাবে লক ও লগআউট করা হয়েছে।');
      render();
    }

    function handleUpdateSettings(e) {
      e.preventDefault();
      const newPass = e.target.new_pass.value;
      const newWa = e.target.new_wa.value;
      const newEmail = e.target.new_email.value;
      if (newPass) state.adminPassword = newPass;
      if (newWa) state.adminWhatsApp = newWa;
      if (newEmail) state.adminEmail = newEmail;
      saveState();
      alert('অ্যাডমিন সেটিংস, ইমেইল ও পাসওয়ার্ড সফলভাবে আপডেট করা হয়েছে!');
      render();
    }

    function setCategory(cat) {
      state.category = cat;
      render();
    }

    function setSearch(q) {
      state.searchQuery = q;
      render();
    }

    function setAdminTab(tab) {
      state.adminTab = tab;
      render();
    }

    function openHireModal(id) {
      state.selectedPhotographer = state.photographers.find(p => p.id === id);
      state.modalOpen = true;
      state.lastSubmittedInquiry = null;
      render();
    }

    function closeHireModal() {
      state.modalOpen = false;
      state.lastSubmittedInquiry = null;
      render();
    }

    function handleAddPhotographer(e) {
      e.preventDefault();
      const f = e.target;
      const newPhoto = {
        id: 'photo-' + Date.now(),
        name: f.p_name.value,
        city: f.p_city.value,
        specialties: f.p_specialties.value.split(',').map(s => s.trim()),
        price: Number(f.p_price.value),
        rating: 5.0,
        phone: f.p_phone.value || state.adminWhatsApp,
        cover: f.p_cover.value || 'https://images.unsplash.com/photo-1542038784456-1ea8e935640e?auto=format&fit=crop&w=800&q=80',
        bio: f.p_bio.value
      };

      state.photographers.unshift(newPhoto);
      saveState();
      alert(`ফটোগ্রাফার "${newPhoto.name}" সফলভাবে যুক্ত হয়েছে!`);
      state.adminTab = 'list';
      render();
    }

    function handleDeletePhotographer(id, name) {
      if (confirm(`আপনি কি "${name}" কে প্ল্যাটফর্ম থেকে মুছে ফেলতে চান?`)) {
        state.photographers = state.photographers.filter(p => p.id !== id);
        saveState();
        render();
      }
    }

    // Handles Hiring Submission, Email dispatch & WhatsApp format
    async function handleHireSubmit(e) {
      e.preventDefault();
      const f = e.target;
      const ref = 'VIS-HR-' + Math.floor(100000 + Math.random() * 900000);
      const photoName = state.selectedPhotographer ? state.selectedPhotographer.name : 'Assigned Talent';
      
      const newInq = {
        id: ref,
        client: f.c_name.value,
        email: f.c_email.value,
        phone: f.c_phone.value,
        photographer: photoName,
        event: f.c_event.value,
        date: f.c_date.value,
        status: 'Pending'
      };

      state.inquiries.unshift(newInq);
      saveState();

      // Background Email Transmission to Admin's Gmail via FormSubmit
      state.isSubmittingEmail = true;
      render();

      try {
        fetch(`https://formsubmit.co/ajax/${encodeURIComponent(state.adminEmail)}`, {
          method: "POST",
          headers: { 
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            "Tracking_Reference": ref,
            "Client_Name": newInq.client,
            "Client_Email": newInq.email,
            "Client_Phone": newInq.phone,
            "Selected_Photographer": photoName,
            "Event_Occasion": newInq.event,
            "Event_Date": newInq.date,
            "Currency": "BDT (৳)",
            "_subject": `[VISUAL Marketplace] New Lead: ${ref} - ${newInq.client}`
          })
        }).catch(err => console.log('Email dispatched in background:', err));
      } catch (err) {
        console.error(err);
      }

      state.isSubmittingEmail = false;

      // WhatsApp URL
      const msg = `*New Hiring Request - VISUAL Marketplace*\n\n` +
        `*Tracking Code:* ${ref}\n` +
        `*Client Name:* ${newInq.client}\n` +
        `*Client Email:* ${newInq.email}\n` +
        `*Contact:* ${newInq.phone}\n` +
        `*Selected Photographer:* ${photoName}\n` +
        `*Event Occasion:* ${newInq.event}\n` +
        `*Event Date:* ${newInq.date}\n` +
        `*Currency:* BDT (৳)\n\n` +
        `_Platform: VISUAL (Owner: ${siteConfig.owner})_`;

      const cleanWa = state.adminWhatsApp.replace(/\D/g, '');
      const waUrl = `https://wa.me/${cleanWa}?text=${encodeURIComponent(msg)}`;

      // Mailto URL
      const mailtoSubject = encodeURIComponent(`[VISUAL Booking] ${ref} - ${newInq.event}`);
      const mailtoBody = encodeURIComponent(
        `Hello Admin / ${photoName},\n\nI have requested a booking on VISUAL.\n\n` +
        `Tracking ID: ${ref}\nName: ${newInq.client}\nEmail: ${newInq.email}\nPhone: ${newInq.phone}\nEvent: ${newInq.event}\nDate: ${newInq.date}\n\nThank you!`
      );
      const mailtoUrl = `mailto:${state.adminEmail}?subject=${mailtoSubject}&body=${mailtoBody}`;

      state.lastSubmittedInquiry = { ...newInq, waUrl, mailtoUrl };
      render();
    }

    function downloadCSV() {
      const csvData = "Reference,Client,Email,Contact,Photographer,Event,Date,Status\n" + 
        state.inquiries.map(i => `${i.id},${i.client},${i.email || 'N/A'},${i.phone || 'N/A'},${i.photographer},${i.event},${i.date},${i.status}`).join("\n");
      const blob = new Blob([csvData], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `visual_inquiries_${Date.now()}.csv`;
      a.click();
    }

    // MAIN RENDER ENGINE
    function render() {
      const app = document.getElementById('app');

      const filtered = state.photographers.filter(p => {
        const matchCat = state.category === 'All' || p.specialties.some(s => s.toLowerCase() === state.category.toLowerCase());
        const matchCity = !state.searchQuery || p.city.toLowerCase().includes(state.searchQuery.toLowerCase());
        return matchCat && matchCity;
      });

      app.innerHTML = `
        <!-- NAVBAR -->
        <nav class="sticky top-0 z-40 bg-[#07080B]/90 backdrop-blur-md border-b border-white/10 px-6 py-4">
          <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div onclick="setView('home')" class="cursor-pointer flex items-center space-x-3">
              <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-black text-white text-xl shadow-[0_0_15px_rgba(99,102,241,0.5)]">
                V
              </div>
              <div>
                <span class="text-xl font-black tracking-widest text-white uppercase block leading-none font-mono">
                  ${siteConfig.name}
                </span>
                <span class="text-[9px] font-mono tracking-widest text-zinc-500 uppercase">
                  PHOTOGRAPHER HUB
                </span>
              </div>
            </div>

            <div class="hidden md:flex items-center space-x-6 text-xs font-mono uppercase tracking-widest text-zinc-400">
              <button onclick="setView('home')" class="${state.view === 'home' ? 'text-cyan-400 font-bold' : 'hover:text-white'}">Home</button>
              <button onclick="setView('explore')" class="${state.view === 'explore' ? 'text-cyan-400 font-bold' : 'hover:text-white'}">Explore (${state.photographers.length})</button>
              <button onclick="setView('admin')" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg border ${state.view === 'admin' ? 'border-indigo-500 text-white bg-indigo-600/20' : 'border-white/10 text-zinc-300 hover:border-cyan-400'}">
                <span>🔒 Admin Panel</span>
              </button>
            </div>

            <div class="flex items-center space-x-3">
              <button onclick="setView('admin')" class="px-4 py-2 rounded-full border border-indigo-500/50 hover:bg-indigo-600/10 text-xs font-mono text-cyan-400 font-bold uppercase">
                + Add Photographer
              </button>
              <button onclick="setView('explore')" class="px-5 py-2 rounded-full bg-gradient-to-r from-indigo-500 to-cyan-500 text-xs font-mono font-bold uppercase text-white shadow-lg">
                Find Talent
              </button>
            </div>
          </div>
        </nav>

        <!-- VIEW: HOME -->
        ${state.view === 'home' ? `
          <main class="flex-1">
            <section class="text-center py-24 px-6 relative">
              <div class="inline-block px-4 py-1.5 rounded-full border border-white/10 bg-white/5 text-[10px] font-mono uppercase tracking-widest text-cyan-400 mb-6">
                ${siteConfig.tagline}
              </div>
              <h1 class="text-5xl md:text-7xl font-black uppercase tracking-tight max-w-4xl mx-auto leading-tight">
                YOUR VISION. <br />
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-white via-zinc-200 to-cyan-400">
                  THE RIGHT PHOTOGRAPHER.
                </span>
              </h1>
              <p class="text-zinc-400 text-sm max-w-xl mx-auto mt-6">
                Discover exceptional photographers, explore extraordinary portfolios, and find the perfect professional for your next unforgettable moment.
              </p>

              <div class="mt-10 flex flex-wrap justify-center gap-4">
                <button onclick="setView('explore')" class="px-8 py-3.5 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-mono font-bold uppercase tracking-widest shadow-lg">
                  Explore Photographers (${state.photographers.length})
                </button>
                <button onclick="setView('admin')" class="px-8 py-3.5 rounded-full border border-white/20 hover:bg-white/5 text-white text-xs font-mono font-bold uppercase tracking-widest">
                  🔒 Admin Console
                </button>
              </div>
            </section>

            <section class="py-16 border-t border-white/10 bg-[#0A0C10] px-6">
              <div class="max-w-6xl mx-auto">
                <h2 class="text-2xl font-black uppercase text-center mb-12">How VISUAL Works</h2>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                  ${['01. Discover Photographers', '02. Explore Portfolios', '03. Submit a Request', '04. Finalize Booking'].map((step) => `
                    <div class="p-6 rounded-2xl bg-[#0F1117] border border-white/5 space-y-2">
                      <span class="text-base font-mono text-cyan-400 font-bold">${step}</span>
                      <p class="text-xs text-zinc-400">Direct collaboration with real-time Email & WhatsApp notification alerts.</p>
                    </div>
                  `).join('')}
                </div>
              </div>
            </section>
          </main>
        ` : ''}

        <!-- VIEW: EXPLORE -->
        ${state.view === 'explore' ? `
          <main class="flex-1 max-w-7xl mx-auto px-6 py-12 w-full">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
              <div>
                <h1 class="text-3xl font-black uppercase">Explore Photographers</h1>
                <p class="text-xs text-zinc-400">Showing ${filtered.length} verified independent photography artists.</p>
              </div>
              <button onclick="setView('admin')" class="self-start px-4 py-2 rounded-xl bg-indigo-600/30 border border-indigo-500/50 text-xs font-mono text-cyan-400">
                + Add New Photographer (Admin)
              </button>
            </div>

            <!-- Filters -->
            <div class="p-4 rounded-2xl bg-[#0F1117] border border-white/10 grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
              <div>
                <label class="text-[10px] font-mono uppercase text-zinc-400 block mb-1">Filter by Category</label>
                <select onchange="setCategory(this.value)" class="w-full bg-[#161922] border border-white/10 rounded-xl px-3 py-2 text-xs text-white">
                  <option value="All" ${state.category === 'All' ? 'selected' : ''}>All Categories</option>
                  ${siteConfig.categories.map(c => `
                    <option value="${c}" ${state.category === c ? 'selected' : ''}>${c}</option>
                  `).join('')}
                </select>
              </div>
              <div>
                <label class="text-[10px] font-mono uppercase text-zinc-400 block mb-1">Search City</label>
                <input type="text" placeholder="e.g. Dhaka, Chittagong, Sylhet..." value="${state.searchQuery}" oninput="setSearch(this.value)" class="w-full bg-[#161922] border border-white/10 rounded-xl px-3 py-2 text-xs text-white" />
              </div>
            </div>

            <!-- Photographers Grid with BDT Currency -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
              ${filtered.length > 0 ? filtered.map(p => `
                <div class="rounded-2xl bg-[#0F1117] border border-white/10 overflow-hidden flex flex-col justify-between">
                  <div class="h-52 bg-zinc-800 relative">
                    <img src="${p.cover}" alt="${p.name}" class="w-full h-full object-cover" />
                    <span class="absolute top-3 left-3 bg-black/60 backdrop-blur-md px-2.5 py-1 rounded-full text-[10px] font-mono">${p.city}</span>
                    <span class="absolute top-3 right-3 bg-black/60 backdrop-blur-md px-2.5 py-1 rounded-full text-[10px] font-mono text-amber-400">★ ${p.rating}</span>
                  </div>
                  <div class="p-6 flex-1 flex flex-col justify-between">
                    <div>
                      <h3 class="text-base font-bold text-white">${p.name}</h3>
                      <p class="text-xs text-zinc-400 mt-2 line-clamp-2">${p.bio}</p>
                      <div class="flex flex-wrap gap-1 mt-3">
                        ${p.specialties.map(s => `
                          <span class="text-[9px] font-mono bg-white/5 border border-white/10 px-2 py-0.5 rounded text-zinc-300">${s}</span>
                        `).join('')}
                      </div>
                    </div>
                    <div class="pt-4 mt-6 border-t border-white/10 flex items-center justify-between">
                      <div>
                        <span class="text-[10px] text-zinc-500 font-mono block">Starting At</span>
                        <span class="text-sm font-bold font-mono text-white">৳${p.price.toLocaleString('en-IN')} <span class="text-[10px] text-zinc-400">BDT</span></span>
                      </div>
                      <button onclick="openHireModal('${p.id}')" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-mono font-bold uppercase text-white shadow-lg">
                        Hire Now
                      </button>
                    </div>
                  </div>
                </div>
              `).join('') : `
                <div class="col-span-3 text-center py-16 text-zinc-500 font-mono text-sm">
                  কোনো ফটোগ্রাফার পাওয়া যায়নি। আপনি অ্যাডমিন প্যানেল থেকে নতুন ফটোগ্রাফার যোগ করতে পারেন।
                </div>
              `}
            </div>
          </main>
        ` : ''}

        <!-- VIEW: ADMIN PANEL (PROTECTED) -->
        ${state.view === 'admin' ? `
          <main class="flex-1 max-w-6xl mx-auto px-6 py-12 w-full">
            <div class="p-6 rounded-2xl bg-[#0F1117] border border-white/10 mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <div class="flex items-center space-x-2">
                  <span class="text-[10px] font-mono uppercase tracking-widest text-emerald-400 bg-emerald-950/60 border border-emerald-500/30 px-2.5 py-1 rounded-full">
                    ● UNLOCKED & AUTHORIZED
                  </span>
                  <button onclick="handleAdminLogout()" class="text-[10px] font-mono text-rose-400 hover:underline">
                    (Lock & Logout)
                  </button>
                </div>
                <h1 class="text-3xl font-black uppercase text-white mt-2">VISUAL Administrator Console</h1>
                <p class="text-xs text-zinc-400 mt-1">Platform Owner & Operator: <strong class="text-white">${siteConfig.owner}</strong></p>
              </div>

              <!-- Admin Tabs -->
              <div class="flex items-center space-x-2 bg-black/40 p-1.5 rounded-xl border border-white/10">
                <button onclick="setAdminTab('add')" class="px-3 py-1.5 rounded-lg text-xs font-mono uppercase ${state.adminTab === 'add' ? 'bg-indigo-600 text-white font-bold' : 'text-zinc-400 hover:text-white'}">
                  + Add Artist
                </button>
                <button onclick="setAdminTab('list')" class="px-3 py-1.5 rounded-lg text-xs font-mono uppercase ${state.adminTab === 'list' ? 'bg-indigo-600 text-white font-bold' : 'text-zinc-400 hover:text-white'}">
                  Manage (${state.photographers.length})
                </button>
                <button onclick="setAdminTab('inquiries')" class="px-3 py-1.5 rounded-lg text-xs font-mono uppercase ${state.adminTab === 'inquiries' ? 'bg-indigo-600 text-white font-bold' : 'text-zinc-400 hover:text-white'}">
                  Inquiries (${state.inquiries.length})
                </button>
                <button onclick="setAdminTab('settings')" class="px-3 py-1.5 rounded-lg text-xs font-mono uppercase ${state.adminTab === 'settings' ? 'bg-indigo-600 text-white font-bold' : 'text-zinc-400 hover:text-white'}">
                  ⚙️ Settings
                </button>
              </div>
            </div>

            <!-- TAB 1: ADD PHOTOGRAPHER -->
            ${state.adminTab === 'add' ? `
              <div class="p-8 rounded-2xl bg-[#0F1117] border border-white/10">
                <h2 class="text-xl font-bold text-white uppercase font-mono mb-1">ম্যানুয়ালি নতুন ফটোগ্রাফার যুক্ত করুন</h2>
                <p class="text-xs text-zinc-400 mb-6">এই ফর্ম পূরণ করে সাবমিট করলে ফটোগ্রাফার সরাসরি Explore পেজে লাইভ হয়ে যাবে।</p>

                <form onsubmit="handleAddPhotographer(event)" class="space-y-4">
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label class="text-[10px] font-mono uppercase text-zinc-400 block mb-1">Photographer / Business Name *</label>
                      <input required name="p_name" type="text" placeholder="e.g. Arham Studio" class="w-full bg-[#161922] border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white" />
                    </div>
                    <div>
                      <label class="text-[10px] font-mono uppercase text-zinc-400 block mb-1">City / Location *</label>
                      <input required name="p_city" type="text" placeholder="e.g. Dhaka, Chittagong" class="w-full bg-[#161922] border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white" />
                    </div>
                  </div>

                  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                      <label class="text-[10px] font-mono uppercase text-zinc-400 block mb-1">Specialties (কমা দিয়ে লিখুন) *</label>
                      <input required name="p_specialties" type="text" placeholder="Wedding, Portrait, Fashion" class="w-full bg-[#161922] border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white" />
                    </div>
                    <div>
                      <label class="text-[10px] font-mono uppercase text-zinc-400 block mb-1">Starting Price (৳ BDT) *</label>
                      <input required name="p_price" type="number" value="6000" class="w-full bg-[#161922] border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white" />
                    </div>
                    <div>
                      <label class="text-[10px] font-mono uppercase text-zinc-400 block mb-1">Contact Phone</label>
                      <input name="p_phone" type="text" placeholder="+8801700000000" class="w-full bg-[#161922] border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white" />
                    </div>
                  </div>

                  <div>
                    <label class="text-[10px] font-mono uppercase text-zinc-400 block mb-1">Cover Image URL (ফাঁকা রাখলে স্বয়ংক্রিয় ছবি বসবে)</label>
                    <input name="p_cover" type="url" placeholder="https://images.unsplash.com/..." class="w-full bg-[#161922] border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white" />
                  </div>

                  <div>
                    <label class="text-[10px] font-mono uppercase text-zinc-400 block mb-1">Photographer Bio / Description *</label>
                    <textarea required rows="3" name="p_bio" placeholder="অভিজ্ঞতা, কাজের স্টাইল সম্পর্কে লিখুন..." class="w-full bg-[#161922] border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white"></textarea>
                  </div>

                  <button type="submit" class="w-full md:w-auto px-8 py-3 rounded-xl bg-gradient-to-r from-indigo-500 to-cyan-500 hover:opacity-90 text-white font-mono text-xs font-bold uppercase tracking-wider shadow-lg">
                    + Save & Publish Photographer (BDT)
                  </button>
                </form>
              </div>
            ` : ''}

            <!-- TAB 2: MANAGE PROFILES -->
            ${state.adminTab === 'list' ? `
              <div class="space-y-3">
                <div class="flex justify-between items-center mb-4">
                  <h3 class="text-sm font-mono uppercase text-zinc-400">Total Active Profiles (${state.photographers.length})</h3>
                  <button onclick="setAdminTab('add')" class="text-xs font-mono text-cyan-400 hover:underline">+ Add New</button>
                </div>

                ${state.photographers.map(p => `
                  <div class="p-4 rounded-xl bg-[#0F1117] border border-white/10 flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div class="flex items-center space-x-4">
                      <img src="${p.cover}" alt="${p.name}" class="w-14 h-14 rounded-xl object-cover border border-white/10" />
                      <div>
                        <h4 class="text-sm font-bold text-white">${p.name}</h4>
                        <p class="text-xs text-zinc-400">${p.city} • Starting: ৳${p.price.toLocaleString('en-IN')} BDT</p>
                        <p class="text-[10px] text-zinc-500 font-mono">${p.specialties.join(', ')}</p>
                      </div>
                    </div>
                    <button onclick="handleDeletePhotographer('${p.id}', '${p.name}')" class="px-3 py-1.5 rounded-lg bg-rose-950/60 border border-rose-500/30 text-rose-400 text-xs font-mono hover:bg-rose-900/60 transition">
                      Delete Profile
                    </button>
                  </div>
                `).join('')}
              </div>
            ` : ''}

            <!-- TAB 3: INQUIRIES -->
            ${state.adminTab === 'inquiries' ? `
              <div class="space-y-4">
                <div class="flex justify-between items-center mb-2">
                  <h3 class="text-sm font-mono uppercase text-zinc-400">Hiring Requests (${state.inquiries.length})</h3>
                  <button onclick="downloadCSV()" class="px-3 py-1.5 rounded-lg bg-white/5 border border-white/10 text-xs font-mono text-zinc-300 hover:text-white">
                    Download CSV
                  </button>
                </div>

                ${state.inquiries.map(inq => `
                  <div class="p-4 rounded-xl bg-[#0F1117] border border-white/10 flex justify-between items-center">
                    <div>
                      <span class="text-xs font-mono text-cyan-400 font-bold">${inq.id}</span>
                      <h4 class="text-sm font-bold text-white">${inq.event} — ${inq.client}</h4>
                      <p class="text-xs text-zinc-400">Photographer: <strong>${inq.photographer}</strong> • Date: ${inq.date}</p>
                      <p class="text-[10px] text-zinc-500">Email: ${inq.email || 'N/A'} • Phone: ${inq.phone || 'N/A'}</p>
                    </div>
                    <span class="text-xs font-mono bg-white/5 px-3 py-1 rounded-lg text-emerald-400">${inq.status}</span>
                  </div>
                `).join('')}
              </div>
            ` : ''}

            <!-- TAB 4: SETTINGS (PASSWORD, WHATSAPP & EMAIL) -->
            ${state.adminTab === 'settings' ? `
              <div class="p-8 rounded-2xl bg-[#0F1117] border border-white/10 max-w-xl">
                <h2 class="text-xl font-bold text-white uppercase font-mono mb-1">অ্যাডমিন সিকিউরিটি ও নোটিফিকেশন সেটিংস</h2>
                <p class="text-xs text-zinc-400 mb-6">এখানে আপনার জিমেইল, WhatsApp নম্বর এবং পাসওয়ার্ড কনফিগার করুন।</p>

                <form onsubmit="handleUpdateSettings(event)" class="space-y-4">
                  <div>
                    <label class="text-[10px] font-mono uppercase text-zinc-400 block mb-1">আপনার নোটিফিকেশন জিমেইল (যেখানে ক্লায়েন্ট বুকিংয়ের মেইল যাবে) *</label>
                    <input required name="new_email" type="email" value="${state.adminEmail}" class="w-full bg-[#161922] border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white font-mono" placeholder="your-email@gmail.com" />
                    <p class="text-[10px] text-zinc-500 mt-1">ক্লায়েন্ট সাবমিট করলে সরাসরি এই ইমেইলে বুকিং নোটিফিকেশন চলে যাবে।</p>
                  </div>

                  <div>
                    <label class="text-[10px] font-mono uppercase text-zinc-400 block mb-1">আপনার WhatsApp নম্বর (যে নম্বরে বুকিং মেসেজ আসবে) *</label>
                    <input required name="new_wa" type="text" value="${state.adminWhatsApp}" class="w-full bg-[#161922] border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white font-mono" />
                    <p class="text-[10px] text-zinc-500 mt-1">দেশ কোড সহ লিখুন, যেমন: +88017XXXXXXXX</p>
                  </div>

                  <div>
                    <label class="text-[10px] font-mono uppercase text-zinc-400 block mb-1">নতুন অ্যাডমিন পাসওয়ার্ড *</label>
                    <input required name="new_pass" type="text" value="${state.adminPassword}" class="w-full bg-[#161922] border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white font-mono" />
                  </div>

                  <button type="submit" class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-mono text-xs font-bold uppercase tracking-wider">
                    Save New Settings
                  </button>
                </form>
              </div>
            ` : ''}
          </main>
        ` : ''}

        <!-- ADMIN LOGIN MODAL -->
        ${state.loginModalOpen ? `
          <div class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
            <div class="bg-[#0F1117] border border-white/10 rounded-3xl p-8 w-full max-w-md relative shadow-2xl">
              <button onclick="state.loginModalOpen=false; render();" class="absolute top-5 right-5 text-zinc-500 hover:text-white">✕</button>
              
              <div class="w-12 h-12 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-xl mb-4">
                🔒
              </div>
              <h3 class="text-xl font-black text-white uppercase tracking-tight">Admin Authentication</h3>
              <p class="text-xs text-zinc-400 mt-1">Restricted Access: <strong>${siteConfig.owner}</strong> Only.</p>

              <form onsubmit="handleAdminLogin(event)" class="space-y-4 mt-6">
                <div>
                  <label class="text-[10px] font-mono uppercase text-zinc-400 block mb-1">Admin Passcode *</label>
                  <input required name="pass" type="password" placeholder="Enter password..." class="w-full bg-[#161922] border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500" />
                  ${state.loginError ? `<p class="text-xs text-rose-400 mt-1.5 font-mono">❌ ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।</p>` : ''}
                </div>

                <button type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-500 to-cyan-500 text-white font-mono text-xs font-bold uppercase tracking-wider shadow-lg">
                  Unlock Admin Console
                </button>
              </form>
              <p class="text-[10px] text-zinc-600 font-mono text-center mt-4">Protected by VISUAL Security Protocol</p>
            </div>
          </div>
        ` : ''}

        <!-- HIRING MODAL WITH DIRECT WHATSAPP & EMAIL INTEGRATION -->
        ${state.modalOpen ? `
          <div class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-[#0F1117] border border-white/10 rounded-3xl p-6 w-full max-w-md relative shadow-2xl">
              <button onclick="closeHireModal()" class="absolute top-5 right-5 text-zinc-500 hover:text-white">✕</button>
              
              ${!state.lastSubmittedInquiry ? `
                <h3 class="text-lg font-bold text-white">Hire ${state.selectedPhotographer ? state.selectedPhotographer.name : 'Photographer'}</h3>
                <p class="text-xs text-zinc-400 mt-1">Submit your specifications. You will get a tracking code and instant alerts.</p>

                <form onsubmit="handleHireSubmit(event)" class="space-y-3 mt-4">
                  <input required name="c_name" type="text" placeholder="Your Full Name *" class="w-full bg-[#161922] border border-white/10 rounded-xl px-3 py-2 text-xs text-white" />
                  <input required name="c_email" type="email" placeholder="Your Email Address *" class="w-full bg-[#161922] border border-white/10 rounded-xl px-3 py-2 text-xs text-white" />
                  <input required name="c_phone" type="tel" placeholder="Your Phone / WhatsApp *" class="w-full bg-[#161922] border border-white/10 rounded-xl px-3 py-2 text-xs text-white" />
                  <input required name="c_event" type="text" placeholder="Event Type (e.g. Wedding, Birthday) *" class="w-full bg-[#161922] border border-white/10 rounded-xl px-3 py-2 text-xs text-white" />
                  <input required name="c_date" type="date" class="w-full bg-[#161922] border border-white/10 rounded-xl px-3 py-2 text-xs text-white" />
                  <button type="submit" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-mono font-bold uppercase text-white transition shadow-lg">
                    ${state.isSubmittingEmail ? 'Transmitting Request...' : 'Submit Hiring Request'}
                  </button>
                </form>
              ` : `
                <!-- SUCCESS & DIRECT NOTIFICATION CARD -->
                <div class="text-center py-4 space-y-4">
                  <div class="w-14 h-14 bg-emerald-500/20 border border-emerald-500/30 rounded-2xl flex items-center justify-center mx-auto text-2xl">
                    ✅
                  </div>
                  <h3 class="text-xl font-black text-white">Request Registered!</h3>
                  <p class="text-xs text-zinc-400">Your unique tracking code:</p>
                  <div class="inline-block px-5 py-2.5 bg-black/60 border border-white/10 rounded-xl font-mono text-cyan-400 font-bold text-base">
                    ${state.lastSubmittedInquiry.id}
                  </div>
                  
                  <div class="p-3 rounded-xl bg-white/5 border border-white/5 text-left text-[11px] text-zinc-400 space-y-1">
                    <p class="flex items-center text-emerald-400 font-bold">
                      <span class="mr-1.5">📧</span> Email notification dispatched to Admin!
                    </p>
                    <p class="text-[10px] text-zinc-500">Destination: ${state.adminEmail}</p>
                  </div>

                  <div class="pt-2 space-y-2">
                    <a href="${state.lastSubmittedInquiry.waUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center space-x-2 w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-mono text-xs font-bold uppercase tracking-wider shadow-lg transition">
                      <span>📱 Send via WhatsApp</span>
                    </a>
                    <a href="${state.lastSubmittedInquiry.mailtoUrl}" class="flex items-center justify-center space-x-2 w-full py-2.5 rounded-xl bg-white/10 hover:bg-white/15 text-zinc-200 font-mono text-xs uppercase tracking-wider transition">
                      <span>✉️ Open in Email App</span>
                    </a>
                  </div>
                </div>
              `}
            </div>
          </div>
        ` : ''}

        <!-- FOOTER -->
        <footer class="bg-[#050608] border-t border-white/10 py-10 px-6 text-xs text-zinc-500 mt-12">
          <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
              <span class="text-white font-mono font-bold uppercase text-sm block">${siteConfig.name}</span>
              <span class="text-[11px] text-zinc-500">${siteConfig.tagline}</span>
            </div>
            <div class="text-center md:text-right">
              <p class="text-zinc-300 font-medium">${siteConfig.attribution}</p>
              <p class="text-[10px] text-zinc-600 mt-0.5">© 2026 VISUAL. All rights reserved.</p>
            </div>
          </div>
        </footer>
      `;
    }

    // Launch immediately
    render();
  </script>
</body>
</html>
